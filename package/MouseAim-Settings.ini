; AC7 mouse-aim settings. Saved by Start-GUI.cmd > 飞控设置; written into the installed config.ini.
; Edit while the game is closed. control_mode: 0=PEACE, 3=WAR. hud_renderer: 1=GPU overlay at native resolution, 3=reticle in the game HUD + GPU panel, 0=legacy windows.
sensitivity=0.1
control_mode=3
manual_ws_pitch=1
free_look_zoom=1.75
mouse_reference_fov=62
camera_mode=1
camera_distance_m=36
camera_height_m=6
follow_rate=8
level_rate=3
hud_renderer=1
hud_fps=120
hud_opacity=0.65
hud_line_width=1
hud_connector=1
hud_link_always=0
hud_boresight=1
model_assist=1
model_assist_strength=0.2
arrival_braking=1.15
