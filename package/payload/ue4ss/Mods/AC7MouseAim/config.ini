[control]
; 0.2.5: rate-limited controller with braking. Legacy gain/damping
; entries below are retained for compatibility, but do not tune this mode.
; Mouse counts to world-space target angle, in degrees.
sensitivity=0.10

; Outer-loop response. Raise gently (0.005 steps) if tracking feels lazy.
roll_gain=0.022
pitch_gain=0.026
yaw_gain=0.012
turn_pull=0.42
max_bank=65.0
smoothing=0.12

; Angular-rate damping and arrival dead zone. These prevent alternating
; full corrections after the nose has crossed the target direction.
roll_damping=0.008
pitch_damping=0.010
yaw_damping=0.30
dead_zone=1.25

; Flip one sign if that axis moves opposite to the target marker.
pitch_sign=-1
roll_sign=1
yaw_sign=1

; Target-marker projection for the default chase camera.
horizontal_fov=100.0
vertical_fov=62.0

; AC7 uses separately verified native fields; these slots are legacy core settings.
pitch_slot=0
roll_slot=2

; HUD target update rate; independent of game FPS. 60..240, reload with F10.
hud_fps=120

; Preserve screen displacement through zoom without anchoring the target to screen.
mouse_reference_fov=62
; 1.0 restores old arrival braking; 1.15 is gentle predictive braking.
arrival_braking=1.15

; Actual bounded model-based braking assist; enabled by default; no new hotkey.
model_assist=1
model_assist_strength=0.20


; Matches the verified AC7/AC8 game bindings: W pitch down, S pitch up.
; Shift/Ctrl remain game-native throttle/brake. No simultaneous binding changes.
manual_ws_pitch=1

; 1 = reticle (ring, gun cross, HMD rings, ticks), panel and notices on the GPU overlay at native resolution (default);
; 3 = reticle inside the game HUD layer (1920x1080, HUD glow) + GPU panel/notices; 0 = legacy small windows.
; Backend selected at startup.
hud_renderer=1
hud_connector=1
hud_link_always=0
hud_opacity=0.65
; Reticle stroke width multiplier for the GPU overlay (0.5-2.0; 1 = thin default). F10 re-reads it in game.
hud_line_width=1
; Flight recording: 1 = FE/Shadow CSV in Logs for analysis, 0 = text log only (default). Read at startup.
flight_recording=0

; Reference gun cross at the nose: 1=shown, 0=hidden at startup. Alt+F7 toggles it in flight (this session only).
hud_boresight=1

; Startup policy: 0=PEACE, 3=WAR (exact AC7 flight-engine controller; degrades to WAR v11.1 if unavailable).
; F4 switches PEACE/WAR in flight.
control_mode=3

; F3 changes camera position policy; both modes keep mouse-facing orientation.
camera_mode=1
camera_distance_m=36
camera_height_m=6

; Additional optical magnification while holding the free-look key and the zoom key (1..3, 1 = none).
free_look_zoom=1.75

[keybindings]
; Windows virtual-key codes, written by Start-GUI.cmd > Keybindings. 0 = unbound.
; Manual pitch/roll/yaw keys must match the game's own control bindings.
free_look=67
free_look_zoom=2
pitch_up=83
pitch_down=87
roll_left=65
roll_right=68
yaw_left=81
yaw_right=69
